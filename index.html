<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lemurian Reimagined — Seven Zones of a Living Civilization</title><style>:root{color-scheme:dark;--bg:#081b1c;--gold:#e9c986;--line:#436b62;--text:#e9eee8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 20%,#1b4842,#081b1c 70%);color:var(--text);font:16px system-ui,Arial}header{text-align:center;padding:35px 16px 8px}h1{font:clamp(30px,5vw,56px) Georgia,serif;color:var(--gold);margin:8px}header p{opacity:.8}main{max-width:1200px;margin:auto;display:grid;grid-template-columns:minmax(320px,1.15fr) minmax(300px,1fr);gap:24px;padding:20px}.map{position:relative;aspect-ratio:1;min-height:350px;background:radial-gradient(circle,#24554a22 20%,transparent 70%);border:1px solid #477568;border-radius:50%;overflow:hidden}.ring{position:absolute;border:1px solid #9cc4a04a;border-radius:50%;inset:12%}.ring.two{inset:24%}.ring.three{inset:36%}.zone{position:absolute;transform:translate(-50%,-50%);border:1px solid #a9bd9a;background:#153d39;color:#f5e8cb;border-radius:50%;width:21%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;cursor:pointer;padding:6px;font-size:clamp(10px,1.25vw,14px);transition:.2s}.zone span{font-size:24px}.zone:hover,.zone.active{background:#ad8851;color:#091f1b;box-shadow:0 0 25px #d9b76b77}.center{left:50%;top:50%;width:24%;background:#7c673b}.panel{border:1px solid var(--line);border-radius:18px;background:#102b2bcc;padding:26px;min-height:450px}h2{font:30px Georgia,serif;color:var(--gold);margin:10px 0}h3{color:var(--gold);margin-bottom:6px}.tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#b6d2bd}.panel p,.panel li{line-height:1.6}button.action{background:#d9b878;border:0;border-radius:8px;padding:12px 15px;color:#102b2b;font-weight:700;cursor:pointer}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.tabs button{background:#21463f;color:white;border:1px solid #56766a;border-radius:8px;padding:9px;cursor:pointer}.tabs button.active{background:#d9b878;color:#142c28}a{color:#f1d494}footer{text-align:center;opacity:.7;padding:20px}textarea{width:100%;min-height:110px;background:#0b2424;border:1px solid #648479;border-radius:8px;color:white;padding:12px;font:inherit}.small{font-size:13px;color:#b3c9be}@media(max-width:790px){main{grid-template-columns:1fr}.zone{font-size:10px}.zone span{font-size:19px}}</style></head><body><header><div class="tag">A living civilization • Research & design laboratory</div><h1>LEMURIAN REIMAGINED</h1><p>Seven Zones of a Living Civilization</p></header><main><section class="map" id="map" aria-label="Interactive civilization map"><div class="ring"></div><div class="ring two"></div><div class="ring three"></div></section><section class="panel"><div class="tag" id="eyebrow">Central Nexus</div><h2 id="title">The Sanctuary</h2><p id="description"></p><div class="tabs"><button data-tab="explore" class="active">Explore</button><button data-tab="build">Build</button><button data-tab="research">Sources</button><button data-tab="journal">Journal</button></div><div id="content"></div></section></main><footer>Myth, history and engineering are distinguished throughout. Prototype v1 · Works offline.</footer><script>
const zones=[
{id:'consciousness',name:'Consciousness',icon:'✧',angle:-90,desc:'A sanctuary for reflection, ethics, contemplative education, and intentional living.',explore:['Daily contemplative practice','Emotional awareness and reflection','Personal sovereignty and ethical growth'],build:['Design accessible quiet spaces','Create optional meditation schedules','Evaluate wellbeing without coercion'],research:'Modern Lemurian accounts emphasize expanded awareness. There is no archaeological evidence for a telepathic Lemurian civilization.'},
{id:'communication',name:'Communication',icon:'◉',angle:-38.57,desc:'A shared language of words, symbols, listening, consent, and collaborative intelligence.',explore:['Symbolic visual language','Dialogue and conflict resolution','Multilingual accessibility'],build:['Develop a symbol lexicon','Prototype community discussion forums','Add AI-assisted translation with privacy safeguards'],research:'Telepathic Lemurian communication is an esoteric claim, not a demonstrated historical fact.'},
{id:'ecology',name:'Food & Ecology',icon:'❀',angle:12.86,desc:'A regenerative landscape of food forests, biodiversity corridors, and resilient local agriculture.',explore:['Agroforestry and seed libraries','Soil health and composting','Seasonal ecological stewardship'],build:['Map growing zones and soil tests','Plan food production and storage','Track biodiversity and crop yields'],research:'Lemurian food traditions are speculative; regenerative agriculture has independent modern evidence.'},
{id:'habitat',name:'Habitat',icon:'⌂',angle:64.29,desc:'Biophilic homes, communal gathering places, accessible pathways, and climate-responsive design.',explore:['Sacred geometry as an artistic design language','Passive heating and cooling','Public and private space balance'],build:['Draft an accessible site plan','Assess zoning, safety and building codes','Prototype modular dwellings'],research:'Crystal cities and temples appear in modern esoteric literature, not verified Lemurian archaeology.'},
{id:'energy',name:'Energy & Water',icon:'≈',angle:115.71,desc:'Reliable renewable power, safe drinking water, sanitation, storage, and resilient infrastructure.',explore:['Solar microgrids and battery storage','Rainwater capture and treatment','Water reuse and monitoring'],build:['Estimate energy loads','Conduct water demand and quality studies','Design redundancy and emergency capacity'],research:'Claims of unlimited crystal energy lack scientific support; real infrastructure needs measurable performance.'},
{id:'knowledge',name:'Knowledge',icon:'◇',angle:167.14,desc:'A living library combining source criticism, science, cultural histories, apprenticeship, and creative learning.',explore:['The Lemurian source archive','Intergenerational education','Community experiments and transparent results'],build:['Catalog claims by evidence level','Create searchable records and citations','Develop learning pathways'],research:'Sclater proposed Lemuria in 1864 as a biogeographic hypothesis; Theosophy later reimagined it as a civilization.'},
{id:'governance',name:'Governance',icon:'⚖',angle:218.57,desc:'Transparent councils, consent, equitable resource systems, conflict resolution, and protected individual rights.',explore:['Participatory decision making','Cooperative economics','Restorative justice and accountability'],build:['Write a community charter','Define budgets and voting procedures','Create safeguards against abuse of power'],research:'Accounts of Lemurian councils vary across modern authors; no verified historical governance records exist.'}
];
const sanctuary={id:'sanctuary',name:'The Sanctuary',icon:'✺',desc:'The heart of the civilization: a place to integrate all seven zones without subordinating individual freedom to any spiritual doctrine.',explore:['View the seven-zone system','Define shared values and ecological goals','Explore dependencies across all zones'],build:['Create a phased pilot project','Set measurable success criteria','Review accessibility, safety and community consent'],research:'Lemuria is not archaeologically established. This interface treats esoteric accounts as cultural narratives and modern design as a testable proposal.'};
let selected=sanctuary,tab='explore';const map=document.getElementById('map');function add(z){const b=document.createElement('button');b.className='zone'+(z.id==='sanctuary'?' center':'');b.innerHTML='<span>'+z.icon+'</span>'+z.name;if(z.angle!==undefined){let a=z.angle*Math.PI/180;b.style.left=(50+38*Math.cos(a))+'%';b.style.top=(50+38*Math.sin(a))+'%'}b.onclick=()=>{selected=z;tab='explore';render()};b.dataset.id=z.id;map.appendChild(b)}zones.forEach(add);add(sanctuary);
function render(){document.getElementById('eyebrow').textContent=selected.id==='sanctuary'?'Central Nexus':'Zone '+(zones.findIndex(z=>z.id===selected.id)+1)+' of 7';document.getElementById('title').textContent=selected.name;document.getElementById('description').textContent=selected.desc;document.querySelectorAll('.zone').forEach(b=>b.classList.toggle('active',b.dataset.id===selected.id));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const c=document.getElementById('content');if(tab==='journal'){let key='lemurian-'+selected.id;c.innerHTML='<h3>Your design notes</h3><p class="small">Saved locally in this browser only.</p><textarea id="notes" aria-label="Zone notes"></textarea><p><button class="action" id="save">Save notes</button></p><p id="saved" aria-live="polite"></p>';document.getElementById('notes').value=localStorage.getItem(key)||'';document.getElementById('save').onclick=()=>{localStorage.setItem(key,document.getElementById('notes').value);document.getElementById('saved').textContent='Saved on this device.'};return}if(tab==='research'){c.innerHTML='<h3>Evidence & interpretation</h3><p>'+selected.research+'</p><p><a href="https://www.gutenberg.org/files/21796/21796-h/21796-h.htm" target="_blank" rel="noopener">The Story of Atlantis and the Lost Lemuria</a></p><p><a href="https://www.nature.com/articles/ngeo1736" target="_blank" rel="noopener">Geological research on Mauritia</a></p><p><a href="https://www.lemurianfellowship.org/" target="_blank" rel="noopener">Lemurian Fellowship (modern tradition)</a></p>';return}let list=selected[tab];c.innerHTML='<h3>'+(tab==='explore'?'Concepts to explore':'Implementation milestones')+'</h3><ul>'+list.map(x=>'<li>'+x+'</li>').join('')+'</ul><p class="small">Select another zone on the circular map to continue.</p>'}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></body></html>
